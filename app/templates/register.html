{% extends 'base.html' %}{% block content %}<a class="back-link" href="/labs">‹ 연구실</a><h1>기존 환경 등록</h1><p>실행 중인 컨테이너를 연구실에 연결합니다. 컨테이너를 새로 만들거나 재시작하지 않습니다.</p>
{% for item in catalog.available %}<details class="card card-pad"><summary>{{item.name}} · {{item.image}}</summary><form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}"><input type="hidden" name="container" value="{{item.name}}"><label>연구실 ID</label><input name="id" pattern="[a-z][a-z0-9-]{2,23}" required><label>연구실 이름</label><input name="title" maxlength="100" required><label>기존 계정 ID</label><input name="username" required><label>SSH 포트</label><input type="number" name="port" min="1" max="65535" required><label>영구 저장경로</label><select name="storage">{% for m in item.mounts %}<option>{{m}}</option>{% endfor %}</select><button {% if not item.mounts %}disabled{% endif %}>연구실 등록</button></form></details>{% else %}<section class="card card-pad"><p>등록하지 않은 컨테이너가 없습니다.</p></section>{% endfor %}{% endblock %}
